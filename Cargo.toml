[package]
name = "egui-web-accesskit"
version = "0.35.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Drop-in egui Plugin that mirrors AccessKit trees to the browser DOM on wasm32"
readme = "README.md"
keywords = ["egui", "accesskit", "accessibility", "wasm", "web"]
categories = ["accessibility", "gui", "wasm"]

[dependencies]
accesskit_consumer = "0.36"
egui = { version = "0.35", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "AddEventListenerOptions",
    "CssStyleDeclaration",
    "Document",
    "DomRect",
    "Element",
    "Event",
    "EventTarget",
    "FocusOptions",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "KeyboardEvent",
    "Node",
    "ShadowRoot",
    "Window",
] }
