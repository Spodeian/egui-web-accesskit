[package]
name = "egui-web-accesskit"
version = "0.35.4"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
description = "Drop-in egui Plugin that mirrors AccessKit trees to the browser DOM on wasm32"
readme = "README.md"
repository = "https://github.com/Spodeian/egui-web-accesskit"
keywords = ["egui", "accesskit", "accessibility", "wasm", "web"]
categories = ["accessibility", "gui", "wasm"]
exclude = ["/.github", "/e2e", "/examples"]

[package.metadata.docs.rs]
default-target = "wasm32-unknown-unknown"
targets = ["wasm32-unknown-unknown", "x86_64-unknown-linux-gnu"]

[dependencies]
accesskit_consumer = "0.36"
egui = { version = "0.35", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "AddEventListenerOptions",
    "CssStyleDeclaration",
    "Document",
    "DomRect",
    "Element",
    "Event",
    "EventTarget",
    "FocusOptions",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "InputEvent",
    "KeyboardEvent",
    "Node",
    "ResizeObserver",
    "ShadowRoot",
    "Window",
] }

[dev-dependencies]
egui = { version = "0.35", default-features = false, features = ["default_fonts"] }
