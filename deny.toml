# cargo-deny configuration. CI runs `cargo deny --all-features check licenses`.
#
# Policy: only licences compatible with this crate's own `MIT OR Apache-2.0`. Copyleft licences
# that would constrain users of the crate (GPL, AGPL, LGPL, MPL-2.0) are not allowed.

[graph]
all-features = true

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
]
exceptions = [
    # egui's bundled default fonts (needed by the `default_fonts` feature). Their licences are
    # permissive and are the only non-OSI-standard entries.
    { crate = "epaint_default_fonts", allow = ["OFL-1.1", "Ubuntu-font-1.0"] },
]
