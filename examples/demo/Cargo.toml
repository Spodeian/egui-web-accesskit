[package]
name = "egui-web-accesskit-demo"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
eframe = "0.37.0"
egui = "0.37.0"
egui-web-accesskit = { path = "../.." }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "HtmlCanvasElement", "Window"] }
