[package]
name = "egui-web-accesskit-demo"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

# This demo is deployed to the browser only. The egui and bridge dependencies are therefore
# restricted to wasm32, so a native build compiles to a stub that explains how to run it.
[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui = "0.37.0"
egui-web-accesskit = { path = "../.." }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Document",
    "Element",
    "HtmlCanvasElement",
    "HtmlElement",
    "Location",
    "Node",
    "ShadowRoot",
    "ShadowRootInit",
    "ShadowRootMode",
    "Window",
] }

# Release profile for the public build. Profiles are read from the root of the package being
# built, and this demo is its own package (no [workspace]), so it must be set here.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = false
