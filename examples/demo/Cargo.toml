[package]
name = "egui-web-accesskit-demo"
version = "0.1.0"
edition = "2024"
publish = false

# This demo is deployed to the browser only. The egui and bridge dependencies are therefore
# restricted to wasm32, so a native build compiles to a stub that explains how to run it.
[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.36", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui = "0.36"
egui-web-accesskit = { path = "../.." }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Document",
    "Element",
    "HtmlCanvasElement",
    "HtmlElement",
    "Location",
    "Node",
    "ShadowRoot",
    "ShadowRootInit",
    "ShadowRootMode",
    "Window",
] }
