# Keeps Rust, npm (e2e) and GitHub Actions dependencies current. Weekly, to limit churn.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /examples/demo
    schedule:
      interval: weekly
    groups:
      demo-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
